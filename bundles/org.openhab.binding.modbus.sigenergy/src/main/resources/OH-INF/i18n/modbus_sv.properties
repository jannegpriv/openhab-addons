# thing types

thing-type.modbus.sigenergy-plant.label = Sigenergy-anläggning
thing-type.modbus.sigenergy-plant.description = Anläggningsövervakning av ett Sigenergy SigenStor-system via Modbus (skrivskyddad).

# thing types config

thing-type.config.sigenergy.plant.maxTries.label = Maximalt antal läsförsök
thing-type.config.sigenergy.plant.maxTries.description = Anger hur många gånger bindningen ska försöka läsa data om ett läsförsök misslyckas. Sätt till `1` för att stänga av omförsök.
thing-type.config.sigenergy.plant.pollInterval.label = Pollningsintervall
thing-type.config.sigenergy.plant.pollInterval.description = Tid mellan datapollningar i ms. Sigenergy-enheter stödjer minst 1000 ms.

# channel group types

channel-group-type.modbus.sigenergy-battery.label = Batteri
channel-group-type.modbus.sigenergy-energy.label = Energi
channel-group-type.modbus.sigenergy-grid.label = Nät
channel-group-type.modbus.sigenergy-overview.label = Översikt

# channel types

channel-type.modbus.sigenergy-available-charge-capacity.label = Tillgänglig laddkapacitet
channel-type.modbus.sigenergy-available-charge-capacity.description = Maximal energi som just nu kan laddas in i batteriet (register 30064).
channel-type.modbus.sigenergy-available-discharge-capacity.label = Tillgänglig urladdningskapacitet
channel-type.modbus.sigenergy-available-discharge-capacity.description = Maximal energi som just nu kan laddas ur batteriet (register 30066).
channel-type.modbus.sigenergy-battery-power.label = Batterieffekt
channel-type.modbus.sigenergy-battery-power.description = Batterieffekt (register 30037): positiv är laddning, negativ är urladdning.
channel-type.modbus.sigenergy-battery-soc.label = Batterinivå (SOC)
channel-type.modbus.sigenergy-battery-soc.description = Sammanlagd laddningsnivå för energilagret (register 30014).
channel-type.modbus.sigenergy-battery-soh.label = Batterihälsa (SOH)
channel-type.modbus.sigenergy-battery-soh.description = Kapacitetsviktad genomsnittlig hälsa för ESS-enheterna (register 30087).
channel-type.modbus.sigenergy-cell-temperature.label = Battericelltemperatur
channel-type.modbus.sigenergy-cell-temperature.description = Genomsnittlig celltemperatur i batteriet (register 30286, protokoll V2.8+).
channel-type.modbus.sigenergy-charge-cutoff-soc.label = Laddningsgräns (SOC)
channel-type.modbus.sigenergy-charge-cutoff-soc.description = Konfigurerad SOC där laddning stoppas (register 30085). Endast övervakning.
channel-type.modbus.sigenergy-discharge-cutoff-soc.label = Urladdningsgräns (SOC)
channel-type.modbus.sigenergy-discharge-cutoff-soc.description = Konfigurerad SOC där urladdning stoppas (register 30086). Endast övervakning.
channel-type.modbus.sigenergy-ems-mode.label = EMS-läge
channel-type.modbus.sigenergy-ems-mode.description = Aktuellt EMS-arbetsläge (register 30003). Okända värden visas som "Unknown (n)".
channel-type.modbus.sigenergy-ems-mode.state.option.MAX_SELF_CONSUMPTION = Maximal egenanvändning
channel-type.modbus.sigenergy-ems-mode.state.option.AI_MODE = AI-läge
channel-type.modbus.sigenergy-ems-mode.state.option.TOU = Tidsstyrning
channel-type.modbus.sigenergy-ems-mode.state.option.FULL_FEED_IN_TO_GRID = Full inmatning till nätet
channel-type.modbus.sigenergy-ems-mode.state.option.REMOTE_EMS = Fjärr-EMS
channel-type.modbus.sigenergy-ems-mode.state.option.CUSTOM = Anpassat
channel-type.modbus.sigenergy-general-load-power.label = Allmän lasteffekt
channel-type.modbus.sigenergy-general-load-power.description = Allmän lasteffekt (register 30282, protokoll V2.8+). Odefinierad på äldre firmware.
channel-type.modbus.sigenergy-grid-phase-a-power.label = Näteffekt fas A
channel-type.modbus.sigenergy-grid-phase-a-power.description = Nätsensorns aktiva effekt fas A (register 30052): positiv är import, negativ är export.
channel-type.modbus.sigenergy-grid-phase-b-power.label = Näteffekt fas B
channel-type.modbus.sigenergy-grid-phase-b-power.description = Nätsensorns aktiva effekt fas B (register 30054): positiv är import, negativ är export.
channel-type.modbus.sigenergy-grid-phase-c-power.label = Näteffekt fas C
channel-type.modbus.sigenergy-grid-phase-c-power.description = Nätsensorns aktiva effekt fas C (register 30056): positiv är import, negativ är export.
channel-type.modbus.sigenergy-grid-power.label = Näteffekt
channel-type.modbus.sigenergy-grid-power.description = Effektutbyte med nätet (register 30005): positiv är import, negativ är export.
channel-type.modbus.sigenergy-grid-sensor-status.label = Nätsensorstatus
channel-type.modbus.sigenergy-grid-sensor-status.description = Om Sigenergys nätsensor kommunicerar (register 30004). Okända värden visas som "Unknown (n)".
channel-type.modbus.sigenergy-grid-sensor-status.state.option.NOT_CONNECTED = Ej ansluten
channel-type.modbus.sigenergy-grid-sensor-status.state.option.CONNECTED = Ansluten
channel-type.modbus.sigenergy-last-update.label = Senast uppdaterad
channel-type.modbus.sigenergy-last-update.description = Tidsstämpel för senaste fullständigt avkodade snabbpollning. Uppdateras inte vid misslyckade läsningar.
channel-type.modbus.sigenergy-load-consumption-today.label = Förbrukning idag
channel-type.modbus.sigenergy-load-consumption-today.description = Total lastförbrukning idag (register 30092).
channel-type.modbus.sigenergy-load-power.label = Lasteffekt
channel-type.modbus.sigenergy-load-power.description = Total lasteffekt (register 30284, protokoll V2.8+). På äldre firmware utan detta register beräknas värdet som soleffekt + näteffekt - batterieffekt.
channel-type.modbus.sigenergy-on-off-grid-status.label = Nätdriftstatus
channel-type.modbus.sigenergy-on-off-grid-status.description = Om anläggningen körs nätansluten eller i ö-drift (register 30009). Okända värden visas som "Unknown (n)".
channel-type.modbus.sigenergy-on-off-grid-status.state.option.ON_GRID = Nätansluten
channel-type.modbus.sigenergy-on-off-grid-status.state.option.OFF_GRID_AUTO = Ö-drift (automatisk)
channel-type.modbus.sigenergy-on-off-grid-status.state.option.OFF_GRID_MANUAL = Ö-drift (manuell)
channel-type.modbus.sigenergy-plant-power.label = Anläggningseffekt
channel-type.modbus.sigenergy-plant-power.description = Anläggningens totala aktiva effekt (register 30031).
channel-type.modbus.sigenergy-plant-running-state.label = Driftstatus
channel-type.modbus.sigenergy-plant-running-state.description = Anläggningens driftstatus (register 30051). Okända värden visas som "Unknown (n)".
channel-type.modbus.sigenergy-plant-running-state.state.option.STANDBY = Vänteläge
channel-type.modbus.sigenergy-plant-running-state.state.option.RUNNING = I drift
channel-type.modbus.sigenergy-plant-running-state.state.option.FAULT = Fel
channel-type.modbus.sigenergy-plant-running-state.state.option.SHUTDOWN = Avstängd
channel-type.modbus.sigenergy-plant-running-state.state.option.ENVIRONMENTAL_ABNORMALITY = Omgivningsavvikelse
channel-type.modbus.sigenergy-pv-generation-today.label = Solproduktion idag
channel-type.modbus.sigenergy-pv-generation-today.description = Solelproduktion idag (register 30272).
channel-type.modbus.sigenergy-pv-generation-yesterday.label = Solproduktion igår
channel-type.modbus.sigenergy-pv-generation-yesterday.description = Solelproduktion föregående dag (register 30274).
channel-type.modbus.sigenergy-pv-power.label = Soleffekt
channel-type.modbus.sigenergy-pv-power.description = Aktuell solelproduktion (register 30035).
channel-type.modbus.sigenergy-rated-capacity.label = Nominell energikapacitet
channel-type.modbus.sigenergy-rated-capacity.description = Batteriets nominella energikapacitet (register 30083).
channel-type.modbus.sigenergy-total-battery-charged-energy.label = Totalt laddad batterienergi
channel-type.modbus.sigenergy-total-battery-charged-energy.description = Ackumulerad energi laddad in i batteriet (register 30200).
channel-type.modbus.sigenergy-total-battery-discharged-energy.label = Totalt urladdad batterienergi
channel-type.modbus.sigenergy-total-battery-discharged-energy.description = Ackumulerad energi urladdad från batteriet (register 30204).
channel-type.modbus.sigenergy-total-exported-energy.label = Totalt exporterad energi
channel-type.modbus.sigenergy-total-exported-energy.description = Ackumulerad energi exporterad till nätet (register 30220).
channel-type.modbus.sigenergy-total-imported-energy.label = Totalt importerad energi
channel-type.modbus.sigenergy-total-imported-energy.description = Ackumulerad energi importerad från nätet (register 30216).
channel-type.modbus.sigenergy-total-load-consumption.label = Total förbrukning
channel-type.modbus.sigenergy-total-load-consumption.description = Ackumulerad lastförbrukning (register 30094).
channel-type.modbus.sigenergy-total-pv-generation.label = Total solproduktion
channel-type.modbus.sigenergy-total-pv-generation.description = Ackumulerad solelproduktion (register 30088).

# EVAC (phase 3)

thing-type.modbus.sigenergy-evac.label = Sigen EV AC-laddare
thing-type.modbus.sigenergy-evac.description = Skrivskyddad övervakning av en Sigen EVAC-laddare via anläggningens Modbus TCP-anslutning. Laddarens eget Modbus unit-ID (1-246) måste konfigureras i mySigen-appen.
thing-type.config.sigenergy.evac.unitId.label = Laddarens unit-ID
thing-type.config.sigenergy.evac.unitId.description = Laddarens eget Modbus unit-ID (1-246), enligt konfigurationen i mySigen-appen. Skiljer sig från anläggningens unit-ID 247 på bryggan.
thing-type.config.sigenergy.evac.pollInterval.label = Pollningsintervall
thing-type.config.sigenergy.evac.pollInterval.description = Tid mellan datapollningar i ms. Sigenergy-enheter stödjer minst 1000 ms.
thing-type.config.sigenergy.evac.maxTries.label = Maximalt antal läsförsök
thing-type.config.sigenergy.evac.maxTries.description = Anger hur många gånger bindningen ska försöka läsa data om ett läsförsök misslyckas. Sätt till `1` för att stänga av omförsök.

channel-group-type.modbus.sigenergy-evac-status.label = Status
