# thing types

thing-type.modbus.sigenergy-evac.label = Sigen EV AC Charger
thing-type.modbus.sigenergy-evac.description = Read-only monitoring of a Sigen EVAC charger through the plant's Modbus TCP endpoint. The charger's own Modbus unit ID (1-246) must be configured in the mySigen app.
thing-type.modbus.sigenergy-inverter.label = Sigenergy Hybrid Inverter
thing-type.modbus.sigenergy-inverter.description = Read-only monitoring of a Sigenergy hybrid inverter, including per-string PV data. Uses the inverter's own Modbus unit ID (1-246, configured in mySigen).
thing-type.modbus.sigenergy-plant.label = Sigenergy Plant
thing-type.modbus.sigenergy-plant.description = Plant-level monitoring of a Sigenergy SigenStor system via Modbus (read-only).

# thing types config

thing-type.config.sigenergy.evac.maxTries.label = Maximum Tries When Reading
thing-type.config.sigenergy.evac.maxTries.description = Specifies how many times the binding should retry reading data if a read attempt fails. Set to `1` to disable retries and use a single attempt.
thing-type.config.sigenergy.evac.pollInterval.label = Poll Interval
thing-type.config.sigenergy.evac.pollInterval.description = Time between polling the data in ms. Sigenergy devices support a minimum interval of 1000 ms.
thing-type.config.sigenergy.evac.unitId.label = Charger Unit ID
thing-type.config.sigenergy.evac.unitId.description = The charger's own Modbus unit ID (1-246), as configured in the mySigen app. Distinct from the plant unit ID 247 on the bridge.
thing-type.config.sigenergy.inverter.maxTries.label = Maximum Tries When Reading
thing-type.config.sigenergy.inverter.maxTries.description = Specifies how many times the binding should retry reading data if a read attempt fails. Set to `1` to disable retries and use a single attempt.
thing-type.config.sigenergy.inverter.pollInterval.label = Poll Interval
thing-type.config.sigenergy.inverter.pollInterval.description = Time between polling the data in ms. The default is slower than the plant poll to keep the shared Modbus endpoint within its request budget.
thing-type.config.sigenergy.inverter.unitId.label = Inverter Unit ID
thing-type.config.sigenergy.inverter.unitId.description = The inverter's own Modbus unit ID (1-246), as configured in the mySigen app. Distinct from the plant unit ID 247 on the bridge.
thing-type.config.sigenergy.plant.maxTries.label = Maximum Tries When Reading
thing-type.config.sigenergy.plant.maxTries.description = Specifies how many times the binding should retry reading data if a read attempt fails. Set to `1` to disable retries and use a single attempt.
thing-type.config.sigenergy.plant.pollInterval.label = Poll Interval
thing-type.config.sigenergy.plant.pollInterval.description = Time between polling the data in ms. Sigenergy devices support a minimum interval of 1000 ms.

