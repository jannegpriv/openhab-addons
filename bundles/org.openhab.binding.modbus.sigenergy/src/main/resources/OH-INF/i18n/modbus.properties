# channel types

channel-type.modbus.sigenergy-available-charge-capacity.label = Available Charging Capacity
channel-type.modbus.sigenergy-available-charge-capacity.description = Maximum energy that can currently be charged into the ESS (register 30064).
channel-type.modbus.sigenergy-available-discharge-capacity.label = Available Discharging Capacity
channel-type.modbus.sigenergy-available-discharge-capacity.description = Maximum energy that can currently be discharged from the ESS (register 30066).
channel-type.modbus.sigenergy-battery-power.label = Battery Power
channel-type.modbus.sigenergy-battery-power.description = Battery power (register 30037): positive is charging, negative is discharging.
channel-type.modbus.sigenergy-battery-soc.label = Battery Level (SOC)
channel-type.modbus.sigenergy-battery-soc.description = Aggregate state of charge of the energy storage system (register 30014).
channel-type.modbus.sigenergy-battery-soh.label = Battery Health (SOH)
channel-type.modbus.sigenergy-battery-soh.description = Capacity-weighted average state of health of the ESS devices (register 30087).
channel-type.modbus.sigenergy-cell-temperature.label = Battery Cell Temperature
channel-type.modbus.sigenergy-cell-temperature.description = Average ESS cell temperature (register 30286, protocol V2.8+).
channel-type.modbus.sigenergy-charge-cutoff-soc.label = Charge Cut-Off SOC
channel-type.modbus.sigenergy-charge-cutoff-soc.description = Configured SOC at which charging stops (register 30085). Monitoring only.
channel-type.modbus.sigenergy-discharge-cutoff-soc.label = Discharge Cut-Off SOC
channel-type.modbus.sigenergy-discharge-cutoff-soc.description = Configured SOC at which discharging stops (register 30086). Monitoring only.
channel-type.modbus.sigenergy-ems-mode.label = EMS Work Mode
channel-type.modbus.sigenergy-ems-mode.description = Current EMS work mode (register 30003). Unknown values are shown as "Unknown (n)".
channel-type.modbus.sigenergy-ems-mode.state.option.MAX_SELF_CONSUMPTION = Max self consumption
channel-type.modbus.sigenergy-ems-mode.state.option.AI_MODE = AI mode
channel-type.modbus.sigenergy-ems-mode.state.option.TOU = Time of use
channel-type.modbus.sigenergy-ems-mode.state.option.FULL_FEED_IN_TO_GRID = Full feed-in to grid
channel-type.modbus.sigenergy-ems-mode.state.option.REMOTE_EMS = Remote EMS mode
channel-type.modbus.sigenergy-ems-mode.state.option.CUSTOM = Custom
channel-type.modbus.sigenergy-evac-alarm-active.label = Charger Alarm Active
channel-type.modbus.sigenergy-evac-alarm-active.description = ON if any documented alarm bit of registers 32012-32014 is set.
channel-type.modbus.sigenergy-evac-alarm-mask-1.label = Charger Alarm Mask 1
channel-type.modbus.sigenergy-evac-alarm-mask-1.description = Raw alarm bit mask, register 32012.
channel-type.modbus.sigenergy-evac-alarm-mask-2.label = Charger Alarm Mask 2
channel-type.modbus.sigenergy-evac-alarm-mask-2.description = Raw alarm bit mask, register 32013.
channel-type.modbus.sigenergy-evac-alarm-mask-3.label = Charger Alarm Mask 3
channel-type.modbus.sigenergy-evac-alarm-mask-3.description = Raw alarm bit mask, register 32014.
channel-type.modbus.sigenergy-evac-alarm-summary.label = Charger Alarm Summary
channel-type.modbus.sigenergy-evac-alarm-summary.description = Active documented alarms as canonical identifiers, or NONE.
channel-type.modbus.sigenergy-evac-charging-power.label = Charging Power
channel-type.modbus.sigenergy-evac-charging-power.description = Current charging power (register 32003). Positive while charging.
channel-type.modbus.sigenergy-evac-input-breaker-current.label = Charger Input Breaker Rating
channel-type.modbus.sigenergy-evac-input-breaker-current.description = Rated current of the charger's own input breaker (register 32010). This is a property of the charger, not the household main fuse or the DLM limit.
channel-type.modbus.sigenergy-evac-rated-current.label = Charger Rated Current
channel-type.modbus.sigenergy-evac-rated-current.description = Rated current of the charger (register 32007).
channel-type.modbus.sigenergy-evac-rated-power.label = Charger Rated Power
channel-type.modbus.sigenergy-evac-rated-power.description = Rated power of the charger (register 32005).
channel-type.modbus.sigenergy-evac-rated-voltage.label = Charger Rated Voltage
channel-type.modbus.sigenergy-evac-rated-voltage.description = Rated voltage of the charger (register 32009).
channel-type.modbus.sigenergy-evac-raw-state.label = Charger Raw State Code
channel-type.modbus.sigenergy-evac-raw-state.description = Raw value of register 32000, for diagnostics.
channel-type.modbus.sigenergy-evac-system-state.label = Charger System State
channel-type.modbus.sigenergy-evac-system-state.description = IEC 61851-1 system state of the charger (register 32000, Appendix 7). Unknown values are shown as "UNKNOWN_n".
channel-type.modbus.sigenergy-evac-system-state.state.option.SYSTEM_INIT = System init
channel-type.modbus.sigenergy-evac-system-state.state.option.A1_A2 = State A1/A2
channel-type.modbus.sigenergy-evac-system-state.state.option.B1 = State B1
channel-type.modbus.sigenergy-evac-system-state.state.option.B2 = State B2
channel-type.modbus.sigenergy-evac-system-state.state.option.C1 = State C1
channel-type.modbus.sigenergy-evac-system-state.state.option.C2 = State C2
channel-type.modbus.sigenergy-evac-system-state.state.option.F = State F
channel-type.modbus.sigenergy-evac-system-state.state.option.E = State E
channel-type.modbus.sigenergy-evac-total-energy.label = Charger Total Energy
channel-type.modbus.sigenergy-evac-total-energy.description = Cumulative energy consumed by the charger (register 32001).
channel-type.modbus.sigenergy-general-load-power.label = General Load Power
channel-type.modbus.sigenergy-general-load-power.description = General load power (register 30282, protocol V2.8+). Stays undefined on older firmware.
channel-type.modbus.sigenergy-grid-phase-a-power.label = Grid Phase A Power
channel-type.modbus.sigenergy-grid-phase-a-power.description = Grid sensor phase A active power (register 30052): positive is import, negative is export.
channel-type.modbus.sigenergy-grid-phase-b-power.label = Grid Phase B Power
channel-type.modbus.sigenergy-grid-phase-b-power.description = Grid sensor phase B active power (register 30054): positive is import, negative is export.
channel-type.modbus.sigenergy-grid-phase-c-power.label = Grid Phase C Power
channel-type.modbus.sigenergy-grid-phase-c-power.description = Grid sensor phase C active power (register 30056): positive is import, negative is export.
channel-type.modbus.sigenergy-grid-power.label = Grid Power
channel-type.modbus.sigenergy-grid-power.description = Power exchanged with the grid (register 30005): positive is import, negative is export.
channel-type.modbus.sigenergy-grid-sensor-status.label = Grid Sensor Status
channel-type.modbus.sigenergy-grid-sensor-status.description = Whether the Sigenergy grid power sensor is communicating (register 30004). Unknown values are shown as "Unknown (n)".
channel-type.modbus.sigenergy-grid-sensor-status.state.option.NOT_CONNECTED = Not connected
channel-type.modbus.sigenergy-grid-sensor-status.state.option.CONNECTED = Connected
channel-type.modbus.sigenergy-last-update.label = Last Successful Update
channel-type.modbus.sigenergy-last-update.description = Timestamp of the last fully decoded fast poll. Not updated on failed reads.
channel-type.modbus.sigenergy-load-consumption-today.label = Load Consumption Today
channel-type.modbus.sigenergy-load-consumption-today.description = Total load consumption today (register 30092).
channel-type.modbus.sigenergy-load-power.label = Load Power
channel-type.modbus.sigenergy-load-power.description = Total load power (register 30284, protocol V2.8+). On older firmware without this register the value is derived as PV power + grid power - battery power.
channel-type.modbus.sigenergy-on-off-grid-status.label = On/Off-Grid Status
channel-type.modbus.sigenergy-on-off-grid-status.description = Whether the plant is operating on-grid or off-grid (register 30009). Unknown values are shown as "Unknown (n)".
channel-type.modbus.sigenergy-on-off-grid-status.state.option.ON_GRID = On grid
channel-type.modbus.sigenergy-on-off-grid-status.state.option.OFF_GRID_AUTO = Off grid (auto)
channel-type.modbus.sigenergy-on-off-grid-status.state.option.OFF_GRID_MANUAL = Off grid (manual)
channel-type.modbus.sigenergy-plant-power.label = Plant Active Power
channel-type.modbus.sigenergy-plant-power.description = Total active power of the plant (register 30031).
channel-type.modbus.sigenergy-plant-running-state.label = Plant Running State
channel-type.modbus.sigenergy-plant-running-state.description = Operating state of the plant (register 30051). Unknown values are shown as "Unknown (n)".
channel-type.modbus.sigenergy-plant-running-state.state.option.STANDBY = Standby
channel-type.modbus.sigenergy-plant-running-state.state.option.RUNNING = Running
channel-type.modbus.sigenergy-plant-running-state.state.option.FAULT = Fault
channel-type.modbus.sigenergy-plant-running-state.state.option.SHUTDOWN = Shutdown
channel-type.modbus.sigenergy-plant-running-state.state.option.ENVIRONMENTAL_ABNORMALITY = Environmental abnormality
channel-type.modbus.sigenergy-pv-generation-today.label = PV Generation Today
channel-type.modbus.sigenergy-pv-generation-today.description = Photovoltaic generation today (register 30272).
channel-type.modbus.sigenergy-pv-generation-yesterday.label = PV Generation Yesterday
channel-type.modbus.sigenergy-pv-generation-yesterday.description = Photovoltaic generation of the previous day (register 30274).
channel-type.modbus.sigenergy-pv-power.label = PV Power
channel-type.modbus.sigenergy-pv-power.description = Current photovoltaic generation power (register 30035).
channel-type.modbus.sigenergy-rated-capacity.label = Rated Energy Capacity
channel-type.modbus.sigenergy-rated-capacity.description = Rated energy capacity of the ESS (register 30083).
channel-type.modbus.sigenergy-total-battery-charged-energy.label = Total Battery Charged Energy
channel-type.modbus.sigenergy-total-battery-charged-energy.description = Cumulative energy charged into the ESS (register 30200).
channel-type.modbus.sigenergy-total-battery-discharged-energy.label = Total Battery Discharged Energy
channel-type.modbus.sigenergy-total-battery-discharged-energy.description = Cumulative energy discharged from the ESS (register 30204).
channel-type.modbus.sigenergy-total-exported-energy.label = Total Exported Energy
channel-type.modbus.sigenergy-total-exported-energy.description = Cumulative energy exported to the grid (register 30220).
channel-type.modbus.sigenergy-total-imported-energy.label = Total Imported Energy
channel-type.modbus.sigenergy-total-imported-energy.description = Cumulative energy imported from the grid (register 30216).
channel-type.modbus.sigenergy-total-load-consumption.label = Total Load Consumption
channel-type.modbus.sigenergy-total-load-consumption.description = Cumulative load consumption (register 30094).
channel-type.modbus.sigenergy-total-pv-generation.label = Total PV Generation
channel-type.modbus.sigenergy-total-pv-generation.description = Cumulative photovoltaic generation (register 30088).
